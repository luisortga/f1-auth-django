[project]
name = "f1-rest-api-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luisOrtga", email = "ortegaluiskb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.12",
    "uvicorn>=0.52.4",
    "whitenoise[brotli]>=6.12.0",
]

[project.scripts]
f1-rest-api-django = "f1_rest_api_django:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ... (aquí abajo verás lo que uv ya creó para Django de forma automática) ...

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
