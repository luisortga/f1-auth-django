{% extends 'base.html' %} {% block content %}
<h1>Pilots</h1>

<ul>

    {% for pilot in pilots_all %}

    <li>

        <a href="{% url 'pilot_detail' pilot.id %}">
        <strong>{{pilot.title}}</strong>
        </a>
        <h3>{{pilot.name}}</h3>
        <h3>{{pilot.team}}</h3>
        <p>{{pilot.user.username}}</p>
    </li>

    {% endfor %}
</ul>

{% endblock %}
